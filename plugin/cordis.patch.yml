# DSH Tool Router bundle
#
# Declares the `no-prefill` agent preset as a FIRST-CLASS roster row.
# (The legacy directory form at $DSH_HOME/.agent-presets/<id>/ is no longer
#  read by DSH — see editing-cordis-compositions — which is why the old
#  no-prefill preset never appeared on the Agent Presets page.)
#
# The preset's distinctive property: it mounts the router, which restricts
# every other tool out of the agent's view, so prefill carries ONE small
# find_tool schema instead of eleven full tool schemas.
#
# TOOL ROWS LIVE AT HOST SCOPE (2026-10-07): the Agent Presets page renders a
# preset's DECLARED composition, so mounting the six tool providers here made
# the page list every tool instead of just find_tool. The providers are now
# enabled as host rows below (same mechanism dsh-web-app used to switch them
# off) and `present` is inserted — the profile ships no host row for it.
# Preset-scoped registrations shadow host ones, so standard/ptc/cordis/minimal
# keep their own declarations and behaviour untouched.
- insert:
    - id: preset-no-prefill
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: no-prefill
        name: No Prefill
        description: >-
          Zero tool schemas in prefill. Discovers one tool at a time through the
          decision model API on this device, then receives that tool's schema on demand.
        order: 10
        plugins:
          # `complete` makes this persona the whole system prompt, and
          # includeRuntimeContext:false keeps runtime context out of prefill.
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are a helpful assistant running in DeepSeek Harness.

                Default: reply in plain text. Do NOT call any tool unless the user's request needs action on this device — running a command, reading or changing files, web access, or checking current state. Greetings, thanks, small talk, math, writing, explanations, and anything answerable from what you know need no tool. Never call find_tool just to look around, list tools, or confirm the environment.

                The runtime-context snapshot appended after the user's message comes from the harness, not from the user. Do not echo it and do not call tools to inspect it.

                Only find_tool is exposed right now. When a task genuinely needs a tool:
                1. Call find_tool once with a short request naming what you need (an exact tool name like "bash", "read", or "grep" works best).
                2. If the result carries a schema, call that tool using it. If it carries no schema or a shortlist, retry find_tool with the closest exact tool name.
                3. A tool you already used stays available for the session (already_available: true) — call it directly, never via find_tool again.

                Example: user says "Hey" → you reply with a brief greeting and no tool call.
              complete: true
              includeRuntimeContext: false

          # The router registers find_tool and hides everything else.
          - id: dsh-tool-router
            name: '@residenthiago/dsh-tool-router'

          # `/compact` and its backend. The fuller presets (standard/ptc/
          # cordis/minimal) mount these in an isolated group; without the
          # group the command's `compaction` inject can never resolve, so
          # `/compact` never reaches the slash menu under this preset.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

    # The profile ships no host row for `present` — insert it so the preset
    # needs to mount nothing. Enabled by default (no `disabled` key).
    - id: present
      name: '@deepseek-ai/dsh-tool-present'

# Host tool providers for discovery — configs identical to what the preset
# used to carry; only `disabled` flips.
- id: tool-bash
  disabled: false
- id: tool-fs
  disabled: false
- id: tool-fs-search
  disabled: false
- id: tool-todo
  disabled: false
- id: tool-web
  disabled: false


# Suppress runtime context (system-prompt plugin override).
- id: system-prompt
  config:
    includeRuntimeContext: false
